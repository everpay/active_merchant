name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - master
      - feat/sandbox-gateway-adapter

permissions:
  contents: read

jobs:
  build:
    name: Ruby ${{ matrix.version }} ${{ matrix.gemfile }}
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 3.1
        gemfile:
          - gemfiles/Gemfile.rails50
          - gemfiles/Gemfile.rails51
          - gemfiles/Gemfile.rails52
          - gemfiles/Gemfile.rails60
          - gemfiles/Gemfile.rails_master
        exclude:
          - version: 2.6
            gemfile: gemfiles/Gemfile.rails_master
          - version: 2.5
            gemfile: gemfiles/Gemfile.rails_master
    steps:
      - uses: actions/checkout@v2
      
      - name: Set up Ruby ${{ matrix.version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.version }}
          bundler-cache: true

      - name: Test
        run: bundle exec rake test
      - name: Linter
        run: bundle exec rubocop

  sandbox-adapter:
    name: Sandbox adapter (Ruby 3.4)
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: sandbox/Gemfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Test the sandbox adapter
        run: bundle exec ruby sandbox/adapter_test.rb
